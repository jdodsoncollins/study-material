name: Content checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-catalog.mjs
      - run: node scripts/check-examples.mjs
      - run: node scripts/check-practice.mjs
