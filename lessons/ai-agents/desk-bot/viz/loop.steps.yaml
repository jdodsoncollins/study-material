title: loop
steps:
  - caption: "Trusted context and narrow tool permissions constrain the model loop."
    nodes: [job, model, auth]
  - caption: "Required approval must bind the real user to the exact action; the model cannot supply its own authority."
    nodes: [gate, approve]
  - caption: "Retries preserve operation identity and unknown outcomes remain explicit."
    nodes: [execute, obs, stop]
