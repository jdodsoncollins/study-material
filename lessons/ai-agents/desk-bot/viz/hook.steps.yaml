title: hook
steps:
  - caption: "Commands and Events API messages have different payloads; normalize them without inventing absent fields."
    nodes: [wire, verify, normalize]
  - caption: "Persist accepted work and deduplication state atomically, then acknowledge within the platform deadline."
    nodes: [tx, ack]
  - caption: "Posting progress happens asynchronously; it must not delay acknowledgement."
    nodes: [worker, reply]
