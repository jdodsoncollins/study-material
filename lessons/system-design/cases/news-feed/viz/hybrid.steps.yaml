title: hybrid
steps:
  - caption: "Post and outbox commit together so accepted posts are not lost between storage and fanout."
    nodes: [api, post]
  - caption: "Choose push or pull from measured audience cost; the threshold is a design parameter."
    nodes: [wave, fan, pullstore]
  - caption: "Merge bounded candidate streams and enforce current visibility before returning results."
    nodes: [home, inbox, pull, merge, auth]
