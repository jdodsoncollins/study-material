title: keys
steps:
  - caption: "Validate request fingerprints and enforce one capture operation per intent, even when callers use different keys."
    nodes: [req, claim]
  - caption: "Persist pending work and use a stable downstream operation ID."
    nodes: [pending, psp]
  - caption: "A timeout may follow a successful capture. Reconcile it; do not submit a new charge under a new key."
    nodes: [reconcile, commit, replay]
