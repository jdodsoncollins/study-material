title: crawl
steps:
  - caption: "Admission checks happen before fetching, and destination checks repeat across redirects."
    nodes: [front, gate, fetch]
  - caption: "Extracted links pass scope and deduplication checks before entering the frontier."
    nodes: [result, seen, front]
  - caption: "A Bloom positive is not proof of prior fetch; essential coverage needs exact confirmation. Revisit policy uses durable state."
    nodes: [seen, later]
