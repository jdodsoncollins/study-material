title: lease
steps:
  - caption: "A unique occurrence and schedule advancement share one transaction."
    nodes: [cron, tx]
  - caption: "Lease generations reject stale heartbeats and completions, but downstream effects need their own protection."
    nodes: [claim, run, done]
  - caption: "Recovery retries the same occurrence; a lease expiry does not prove the old worker stopped."
    nodes: [retry, claim]
