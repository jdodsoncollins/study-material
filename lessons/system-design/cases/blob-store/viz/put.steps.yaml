title: put
steps:
  - caption: "Bind parts to the upload version, range, and checksum. Conflicting retries must be detected."
    nodes: [sess, parts]
  - caption: "Readers see a complete object only after verification and manifest publication."
    nodes: [verify, meta]
  - caption: "Signed URLs and caches have a separate revocation policy from metadata deletion."
    nodes: [get, meta, bytes]
