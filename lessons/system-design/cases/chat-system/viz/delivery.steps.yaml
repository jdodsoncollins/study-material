title: delivery
steps:
  - caption: "Authorization, operation deduplication, sequence allocation, and append protect one logical message."
    nodes: [send, api, log]
  - caption: "Acknowledge under the chosen durability policy; each device resumes from its own cursor."
    nodes: [ack, fan, recv]
  - caption: "Push is a reconnect hint, not proof of delivery or reading."
    nodes: [push]
