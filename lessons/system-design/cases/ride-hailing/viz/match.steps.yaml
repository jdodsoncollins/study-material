title: match
steps:
  - caption: "Locations suggest candidates; they do not prove current availability."
    nodes: [ping, geo, ride, match]
  - caption: "Reserve the authoritative driver record before offering, so concurrent riders cannot both reserve it."
    nodes: [reserve, offer]
  - caption: "Acceptance checks identity, generation, expiry, and trip state. Old accepts and expiry timers cannot affect a new offer."
    nodes: [accept, trip]
