title: Sink a cluster
steps:
  - caption: "Scan. Water is ignored. An unvisited land cell starts a component."
    nodes: [scan, land, start]
  - caption: "DFS zeros this cell and its 4-neighbors before they can be counted again."
    nodes: [start, dfs]
  - caption: "The answer is how many times you started a fill, not how many land cells you visited."
    nodes: [dfs, scan]
