title: Take or skip this item
steps:
  - caption: "Item 0 has score 6. Compare taking it with the empty selection."
    nodes: [bay, take, best]
  - caption: "Item 2 has score 9. Taking nonadjacent items 0 and 2 gives 6+9=15."
    nodes: [take, skip, best]
  - caption: "The last score 1 can be added to the best through item 2, giving 16 while skipping adjacent score 8."
    nodes: [best, next]
