title: Map + list
steps:
  - caption: "The hash-table model gives expected constant-time lookup; JavaScript Map does not mandate that implementation."
    nodes: [get, map, node]
  - caption: "Use moves that node to the front."
    nodes: [node, front]
  - caption: "A full put evicts the tail and drops the map entry."
    nodes: [put2, tail, map]
