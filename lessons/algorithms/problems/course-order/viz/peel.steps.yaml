title: Peel indegree zero
steps:
  - caption: "Modules 0 and 4 start at indegree 0. Loners still belong in the order."
    nodes: [seed, peel]
  - caption: "Peeling 0 unlocks 1 and 2. Peeling those unlocks 3."
    nodes: [drop, zero, seed]
  - caption: "If anything is left with indegree > 0, there is a cycle. Return empty."
    nodes: [done, cycle, ok]
