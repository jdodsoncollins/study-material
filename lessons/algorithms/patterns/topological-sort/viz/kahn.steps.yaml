title: kahn
steps:
  - caption: "Indegree zero means all prerequisites have already been emitted or none exist."
    nodes: [zeros, out]
  - caption: "A neighbor enters the queue exactly when its indegree reaches zero."
    nodes: [dec, more]
  - caption: "Unemitted nodes prove a cycle exists, but not every blocked node is necessarily on that cycle."
    nodes: [count, cycle, done]
